name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  # The Visual Studio Marketplace trusts this workflow's GitHub OIDC token (Trusted Publishing).
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::package.json says $version, the tag $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "craft-vscode-$version.vsix" --title "$GITHUB_REF_NAME" --generate-notes
      # Both stores publish the same .vsix.
      # The Visual Studio Marketplace needs no secret: its publisher hayone1 has a Trusted
      # Publishing policy for this repository and ci.yml, and vsce trades this run's OIDC token for
      # a 15-minute Marketplace credential.
      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx vsce publish --oidc --packagePath "craft-vscode-$(node -p "require('./package.json').version").vsix"
      # Open VSX Trusted Publishing (a trusted publisher on the hayone1 namespace). An OVSX_PAT
      # secret, when set, wins: ovsx prefers a token.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="craft-vscode-$(node -p "require('./package.json').version").vsix"
          if [ -n "$OVSX_PAT" ]; then npx ovsx publish "$vsix"; else npx ovsx publish "$vsix" --trusted-publishing; fi
